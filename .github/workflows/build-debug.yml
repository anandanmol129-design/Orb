name: Build Debug APK

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDefaultDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orb-debug-${{ github.sha }}
          path: app/app/build/outputs/apk/default/debug/*.apk
