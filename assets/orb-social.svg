<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#07060f"/>
  <g transform="translate(110 104) scale(0.84)">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#07060f"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset="0.25" stop-color="#7fe3ff"/>
      <stop offset="0.6" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#2a1570"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#7b5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <clipPath id="front">
      <rect x="0" y="268" width="512" height="244"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <g transform="rotate(-14 256 268)">
    <!-- back half of the ring -->
    <ellipse cx="256" cy="268" rx="190" ry="54" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.6"/>
  </g>
  <circle cx="256" cy="256" r="120" fill="url(#orb)"/>
  <ellipse cx="222" cy="198" rx="40" ry="18" fill="#ffffff" opacity="0.35" transform="rotate(-25 222 198)"/>
  <!-- eyes -->
  <rect x="210" y="222" width="22" height="46" rx="11" fill="#0b0820"/>
  <rect x="280" y="222" width="22" height="46" rx="11" fill="#0b0820"/>
  <g transform="rotate(-14 256 268)">
    <!-- front half of the ring passes over the orb -->
    <ellipse cx="256" cy="268" rx="190" ry="54" fill="none" stroke="url(#ring)" stroke-width="10" clip-path="url(#front)"/>
  </g>
  </g>
  <text x="580" y="300" font-family="Inter, 'Noto Sans', sans-serif" font-size="128" font-weight="700" fill="#ffffff">Orb</text>
  <text x="584" y="370" font-family="Inter, 'Noto Sans', sans-serif" font-size="34" fill="#b9b3e6">A living, voice-first Android launcher</text>
  <text x="584" y="420" font-family="Inter, 'Noto Sans', sans-serif" font-size="26" fill="#7f78b0">Expressive orb · animated clocks · live wallpapers</text>
</svg>
